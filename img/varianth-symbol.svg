<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Logoyu tuvalde tam ortalamak için hafif aşağı kaydırıyoruz -->
  <g transform="translate(0, 5)">
    <!-- Sol Sayfa (Orijinal Form): İçi dolu Kryptonite Yeşili -->
    <polygon points="56,105 16,55 16,15 56,65" fill="#00e054" />
    
    <!-- Sağ Sayfa (Varyant Form): İçi boş, sadece çerçeve. "Varianth" isminin hakkını verir. -->
    <polygon points="64,105 104,55 104,15 64,65" fill="none" stroke="#d8e0e8" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Sağ sayfanın içindeki Çizgi Roman Paneli / Aksiyon Vurgusu -->
    <polygon points="76,82 92,62 92,42 76,62" fill="#00e054" />
  </g>
</svg>